# Docker Compose configuration for Ollama and Open-WebUI services

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - ai_internal
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_SIGNUP=false
    volumes:
      - ./open-webui_data:/app/backend/data
    networks:
      - ai_internal
      - caddy_net
    depends_on:
      - ollama

networks:
  ai_internal:
    name: ai_internal
    driver: bridge
  caddy_net:
    name: caddy_net
    external: true