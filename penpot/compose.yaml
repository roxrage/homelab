# penpot compose file

services:
  penpot-frontend:
    image: penpotapp/frontend:latest
    container_name: penpot-frontend
    restart: unless-stopped
    networks:
      - caddy_net
      - penpot_internal
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      - PENPOT_BACKEND_URI=http://penpot-backend:6060
      - PENPOT_FLAGS=enable-smtp,enable-email-verification,enable-registration
    depends_on:
      - penpot-backend
      - penpot-exporter

  penpot-backend:
    image: penpotapp/backend:latest
    container_name: penpot-backend
    restart: unless-stopped
    networks:
      - penpot_internal
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      - PENPOT_DATABASE_PASSWORD=${PENPOT_DB_PASSWORD}
      - PENPOT_DATABASE_URI=${PENPOT_DATABASE_URI}
      - PENPOT_REDIS_URI=${PENPOT_REDIS_URI}
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY}
      - PENPOT_PUBLIC_URI=${PENPOT_PUBLIC_URI}
      - PENPOT_SMTP_DEFAULT_FROM=${PENPOT_SMTP_DEFAULT_FROM}
      - PENPOT_SMTP_DEFAULT_REPLY_TO=${PENPOT_SMTP_DEFAULT_REPLY_TO}
      - PENPOT_SMTP_HOST=${PENPOT_SMTP_HOST}
      - PENPOT_SMTP_PORT=${PENPOT_SMTP_PORT}
      - PENPOT_SMTP_USER=${PENPOT_SMTP_USER}
      - PENPOT_SMTP_USERNAME=${PENPOT_SMTP_USER}
      - PENPOT_SMTP_PASSWORD=${PENPOT_SMTP_PASSWORD}
      - PENPOT_SMTP_TLS=${PENPOT_SMTP_TLS}
      - PENPOT_SMTP_SSL=${PENPOT_SMTP_SSL}
      - PENPOT_FLAGS=enable-smtp,enable-email-verification,enable-registration
    depends_on:
      - penpot-postgres
      - penpot-redis

  penpot-exporter:
    image: penpotapp/exporter:latest
    container_name: penpot-exporter
    restart: unless-stopped
    networks:
      - penpot_internal
    environment:
      - PENPOT_PUBLIC_URI=http://penpot-frontend:8080
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY}
      - PENPOT_REDIS_URI=${PENPOT_REDIS_URI}
    depends_on:
      - penpot-redis

  penpot-postgres:
    image: postgres:15-alpine
    container_name: penpot-postgres
    restart: unless-stopped
    networks:
      - penpot_internal
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD}
    volumes:
      - penpot_pgdata:/var/lib/postgresql/data

  penpot-redis:
    image: redis:7-alpine
    container_name: penpot-redis
    restart: unless-stopped
    networks:
      - penpot_internal
    volumes:
      - penpot_redisdata:/data

volumes:
  penpot_assets:
  penpot_pgdata:
  penpot_redisdata:

networks:
  caddy_net:
    external: true
  penpot_internal: