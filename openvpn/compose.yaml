services:
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1194:1194/udp"
    volumes:
      - /opt/openvpn/data:/etc/openvpn
      - /lib/modules:/lib/modules:ro
    environment:
      - TZ=Europe/Zurich