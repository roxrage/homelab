# Docker Compose configuration for Invoice Ninja

services:
  invoiceninja-app:
    image: invoiceninja/invoiceninja:5
    container_name: invoiceninja-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage:/var/www/app/storage:rw
      - ./public:/var/www/app/public:rw
    networks:
      - ninja-internal
    depends_on:
      - invoiceninja-db
      - invoiceninja-redis

  invoiceninja-web:
    image: nginx:alpine
    container_name: invoiceninja-web
    restart: unless-stopped
    # Keine exposed Host-Ports nötig!
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/app/public:ro
      - ./storage:/var/www/app/storage:ro
    networks:
      - ninja-internal
      - caddy_net
    depends_on:
      - invoiceninja-app

  invoiceninja-db:
    image: mariadb:10.11
    container_name: invoiceninja-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./db-data:/var/lib/mysql:rw
    networks:
      - ninja-internal

  invoiceninja-redis:
    image: redis:alpine
    container_name: invoiceninja-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data:rw
    networks:
      - ninja-internal

networks:
  ninja-internal:
    driver: bridge
  caddy_net:
    external: true